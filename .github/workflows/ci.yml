name: CI

on:
  push:
    branches: [main, integration/**]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux checks and Debian package
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm run audit:production

      - name: Full dependency audit
        run: npm run audit:full

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check formatting
        run: npm run format:check

      - name: Test Rust bridge
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Build Debian package
        run: npm run tauri build -- --bundles deb

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: star-everything-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  windows:
    name: Windows checks and NSIS package
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm run audit:production

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Build Windows installer
        run: npm run tauri build -- --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: star-everything-windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Smoke test installed Windows app
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)" }
          ./scripts/windows-installer-smoke.ps1 `
            -InstallerPath $installers[0].FullName `
            -InstallDirectory (Join-Path $env:RUNNER_TEMP 'star-everything-install') `
            -LogPath (Join-Path $env:RUNNER_TEMP 'star-everything-windows-smoke.log')

      - name: Upload Windows smoke log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: star-everything-windows-smoke-log
          path: ${{ runner.temp }}/star-everything-windows-smoke.log
          if-no-files-found: warn

  mutation:
    name: Full TypeScript mutation test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run mutation tests
        run: npm run mutation:check
